# Confere cada proposta de mudança (pull request) antes da aprovação:
# se algum texto tiver um campo faltando ou errado, aparece um ❌ com a explicação.
name: Conferir proposta

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir textos e gerar o site
        run: npm run build
