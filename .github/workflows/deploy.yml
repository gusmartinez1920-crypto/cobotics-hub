# Gera o site a cada mudança na branch main e grava o resultado (pasta dist/)
# na branch "deploy". A Hostinger busca essa branch pela função GIT do hPanel
# (implantação automática por webhook). Não usa FTP nem senhas: só o token
# interno do GitHub, com permissão de escrita neste repositório.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir e gerar o site
        run: npm run build

      - name: Gravar o site gerado na branch deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true # a branch deploy guarda só a versão atual do site
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
