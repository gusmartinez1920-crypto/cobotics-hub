# Publica o site na Hostinger a cada mudança na branch main.
# Configure em GitHub → Settings → Secrets and variables → Actions:
#   FTP_SERVER    ex.: ftp.cobotics-hub.com  (hPanel → Arquivos → Contas FTP)
#   FTP_USERNAME  usuário FTP
#   FTP_PASSWORD  senha FTP
# Opcional, em "Variables" (não é segredo):
#   FTP_SERVER_DIR  pasta de destino. Padrão: ./public_html/
#                   Use ./ se o "Diretório" da conta FTP no hPanel já terminar em public_html.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicar manualmente pela aba Actions

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir e gerar o site
        run: npm run build

      - name: Enviar para a Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './public_html/' }}
